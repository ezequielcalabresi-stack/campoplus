<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAmpo+ - Administración de Regímenes SICORE (ARCA)</title>
    <script src="https://cdn.tailwindcss.com"></script>
<script src="/campoplus-firma.js"></script>
</head>
<body class="bg-slate-100 font-sans">
    <div class="max-w-6xl mx-auto p-6 my-8 bg-white rounded-xl shadow-lg relative">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <div>
                <h2 class="text-2xl font-bold text-slate-800">CAmpo+ <span class="text-sm font-normal text-slate-500">| Tabla de Regímenes SICORE (Ganancias)</span></h2>
                <p class="text-xs text-emerald-600 mt-1 font-medium">Modifique las alícuotas y Mínimos No Imponibles vigentes de ARCA.</p>
            </div>
            <a href="index.html" class="bg-slate-200 text-slate-700 px-4 py-2 rounded-md text-sm font-medium hover:bg-slate-300">
                ← Volver al Dashboard
            </a>
        </div>

        <div class="overflow-x-auto border rounded-lg text-xs">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-100 text-slate-600 uppercase font-semibold border-b">
                        <th class="p-3">Código</th>
                        <th class="p-3">Descripción del Régimen</th>
                        <th class="p-3 text-right">Alícuota (Ej: 0.0471 = 4,71%)</th>
                        <th class="p-3 text-right">Mínimo No Imponible (MNI $)</th>
                        <th class="p-3 text-center">Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaRegimenes" class="divide-y divide-slate-200">
                    <tr><td colspan="5" class="p-6 text-center text-slate-400">Cargando regímenes...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function cargarRegimenes() {
            try {
                const res = await fetch('/api/regimenes_sicore');
                const data = await res.json();
                let html = "";
                data.forEach(r => {
                    html += `
                        <tr class="hover:bg-slate-50">
                            <td class="p-3 font-mono font-bold text-slate-800">${r.codigo}</td>
                            <td class="p-3"><input type="text" id="desc_${r.codigo}" value="${r.descripcion}" class="border rounded p-1 w-full text-xs"></td>
                            <td class="p-3 text-right"><input type="number" step="0.0001" id="alic_${r.codigo}" value="${r.alicuota}" class="border rounded p-1 w-28 text-xs font-mono text-right"></td>
                            <td class="p-3 text-right"><input type="number" step="0.01" id="mni_${r.codigo}" value="${r.mni}" class="border rounded p-1 w-36 text-xs font-mono text-right font-bold text-blue-900"></td>
                            <td class="p-3 text-center">
                                <button onclick="guardarRegimen('${r.codigo}')" class="bg-indigo-600 text-white px-3 py-1.5 rounded font-bold hover:bg-indigo-700">Actualizar</button>
                            </td>
                        </tr>
                    `;
                });
                document.getElementById('tablaRegimenes').innerHTML = html;
            } catch (e) {
                console.error(e);
            }
        }

        async function guardarRegimen(codigo) {
            let descripcion = document.getElementById(`desc_${codigo}`).value;
            let alicuota = parseFloat(document.getElementById(`alic_${codigo}`).value);
            let mni = parseFloat(document.getElementById(`mni_${codigo}`).value);

            try {
                const res = await fetch(`/api/regimenes_sicore/${codigo}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ descripcion, alicuota, mni })
                });
                const result = await res.json();
                if (!res.ok) throw new Error(result.detail);
                alert("✅ Régimen actualizado con éxito en la base de datos.");
                cargarRegimenes();
            } catch (e) {
                alert("🚨 Error al actualizar: " + e.message);
            }
        }

        window.onload = cargarRegimenes;
    </script>
</body>
</html>
